<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>HZMTube — Watch &amp; Share</title>
<meta name="description" content="HZMTube — a local-first video platform. Watch, search, like and upload; everything is saved in your browser.">
<meta name="theme-color" content="#0b0b10">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 28'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%23ff3b5c'/%3E%3Cstop offset='1' stop-color='%23ff7a45'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='40' height='28' rx='8' fill='url(%23g)'/%3E%3Cpath d='M16 8.5v11l10-5.5z' fill='%23fff'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<script>try{document.documentElement.dataset.theme=(JSON.parse(localStorage.getItem('hzmtube.v1.state')||'{}').theme)||'dark'}catch(e){}</script>
</head>
<body class="has-bottomnav">
<a class="skip" href="#main">Skip to content</a>

<header class="topbar">
  <div class="tb-left">
    <button type="button" class="icon-btn" id="navToggle" aria-label="Toggle navigation"></button>
    <a class="brand" href="index.html" aria-label="HZMTube home">
      <svg class="brand-badge" viewBox="0 0 40 28" aria-hidden="true"><defs><linearGradient id="lgA" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff3b5c"/><stop offset="1" stop-color="#ff7a45"/></linearGradient></defs><rect width="40" height="28" rx="8" fill="url(#lgA)"/><path d="M16 8.5v11l10-5.5z" fill="#fff"/></svg>
      <span class="brand-word">HZM<em>Tube</em></span>
    </a>
  </div>
  <div class="tb-search" id="searchWrap">
    <form class="search" id="searchForm" role="search">
      <span class="search-ic" aria-hidden="true"></span>
      <input id="searchInput" type="text" placeholder="Search HZMTube" autocomplete="off" aria-label="Search videos">
      <button type="button" class="search-clear hidden" id="searchClear" aria-label="Clear search"></button>
      <button type="submit" class="search-go" aria-label="Search"></button>
    </form>
    <div class="suggest hidden" id="suggest" role="listbox" aria-label="Search suggestions"></div>
  </div>
  <div class="tb-right">
    <button type="button" class="icon-btn only-mobile" id="searchMobileBtn" aria-label="Open search"></button>
    <button type="button" class="icon-btn" id="themeBtn" aria-label="Toggle appearance"></button>
    <a class="btn btn-primary btn-create" id="createBtn" href="studio.html?upload=1"><span class="cb-ic"></span><span class="cb-tx">Create</span></a>
    <div class="tb-pop-wrap">
      <button type="button" class="icon-btn" id="notifBtn" aria-label="Notifications" aria-expanded="false"><span class="bell-ic"></span><span class="badge hidden" id="notifBadge">0</span></button>
      <div class="popover hidden" id="notifPop"></div>
    </div>
    <div class="tb-pop-wrap">
      <button type="button" class="avatar-btn" id="avatarBtn" aria-label="Account menu" aria-expanded="false"></button>
      <div class="popover hidden" id="avatarPop"></div>
    </div>
  </div>
</header>

<div class="scrim hidden" id="drawerScrim"></div>
<nav class="sidebar" id="sidebar" aria-label="Main navigation"></nav>

<main class="main" id="main">
  <div class="chipbar" id="chipbar">
    <button type="button" class="chip-arrow left" id="chipPrev" aria-label="Scroll categories left"></button>
    <div class="chips" id="chips" role="tablist" aria-label="Categories"></div>
    <button type="button" class="chip-arrow right" id="chipNext" aria-label="Scroll categories right"></button>
    <div class="sortwrap">
      <select id="sortSel" class="sortsel" aria-label="Sort videos">
        <option value="newest">Newest</option>
        <option value="oldest">Oldest</option>
        <option value="views">Most viewed</option>
        <option value="az">A – Z</option>
      </select>
    </div>
  </div>
  <div class="content">
    <div id="pageHead"></div>
    <div id="banner"></div>
    <div class="grid" id="grid"></div>
    <div id="emptyState"></div>
    <footer class="foot">
      <span class="foot-brand">HZM<em>Tube</em></span>
      <span class="foot-note">© 2026 HZMTube — a local-first concept. Your data never leaves this browser.</span>
      <span class="foot-links">
        <a href="studio.html">Studio</a>
        <button type="button" data-action="reset-data">Reset demo data</button>
        <button type="button" data-action="back-top">Back to top ↑</button>
      </span>
    </footer>
  </div>
</main>

<nav class="bottomnav" id="bottomnav" aria-label="Mobile navigation">
  <button type="button" class="bn-item" data-action="nav" data-nav="home"><span class="bn-ic" data-ic="home"></span>Home</button>
  <button type="button" class="bn-item" data-action="nav" data-nav="trending"><span class="bn-ic" data-ic="trend"></span>Trending</button>
  <a class="bn-create" href="studio.html?upload=1" aria-label="Upload a video"><span data-ic="plus"></span></a>
  <button type="button" class="bn-item" data-action="nav" data-nav="subs"><span class="bn-ic" data-ic="subs"></span>Subs</button>
  <a class="bn-item" href="studio.html"><span class="bn-ic" data-ic="video"></span>Studio</a>
</nav>

<div class="watch hidden" id="watch" aria-hidden="true">
  <div class="watch-scrim" data-action="watch-close"></div>
  <div class="watch-panel" role="dialog" aria-modal="true" aria-label="Video player">
    <div class="watch-tools">
      <button type="button" class="icon-btn dark" data-action="theater-toggle" aria-label="Toggle theater mode" title="Theater mode (t)"><span data-ic="theater"></span></button>
      <button type="button" class="icon-btn dark" data-action="watch-close" aria-label="Close player" title="Close (Esc)"><span data-ic="x"></span></button>
    </div>
    <div class="watch-grid" id="watchGrid"></div>
  </div>
</div>

<div class="toasts" id="toasts" aria-live="polite"></div>
<div id="menuRoot"></div>
<div id="modalRoot"></div>

<script src="shared.js"></script>
<script src="storage.js"></script>
<script src="app.js"></script>
</body>
</html>
